<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Soporte Interno</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <h2>Sistema de Soporte Interno</h2>
        <div id="loginError" class="error-message" style="display: none;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
        <div class="info-box" style="margin-top: 20px;">
            <strong>Bienvenido al Sistema de Soporte Interno</strong><br>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" style="display: none;">
        <div class="header">
            <div class="header-content">
                <h1>Sistema de Soporte Interno</h1>
                <div class="user-info">
                    <span id="currentUser"></span>
                    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- Solicitante Dashboard -->
            <div id="solicitanteDashboard" class="dashboard">
                <div class="section">
                    <h2>Nueva Solicitud</h2>
                    <form id="createForm">
                        <div class="form-group">
                            <label for="titulo">Título:</label>
                            <input type="text" id="titulo" required>
                        </div>
                        <div class="form-group">
                            <label for="descripcion">Descripción:</label>
                            <textarea id="descripcion" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="categoria">Categoría:</label>
                            <select id="categoria" required>
                                <option value="">Seleccione una categoría</option>
                                <option value="Hardware">Hardware</option>
                                <option value="Software">Software</option>
                                <option value="Red">Red</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Crear Solicitud</button>
                    </form>
                    <div id="createSuccess" class="success-message" style="display: none;"></div>
                </div>

                <div class="section">
                    <h2>Mis Solicitudes</h2>
                    <div id="solicitanteTable"></div>
                </div>
            </div>

            <!-- Coordinador Dashboard -->
            <div id="coordinadorDashboard" class="dashboard">
                <div class="section">
                    <h2>Gestión de Solicitudes</h2>
                    <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                        Puede priorizar las solicitudes usando los botones de prioridad.
                    </p>
                    <div id="coordinadorTable"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para detalles -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h3>Detalles de la Solicitud</h3>
            <div id="modalContent"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
